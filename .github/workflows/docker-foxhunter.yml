name: Build FoxFur Seed Hunter container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/docker-foxhunter.yml"
      - "Dockerfile.foxhunter"
      - "custom_nodes/foxhunter_compat/**"
      - "manifests/foxhunter_models.json"
      - "scripts/*foxhunter*"
      - "workflows/foxhunter_seed_hunter_v3.json"
      - "requirements/huggingface.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-foxhunter.yml"
      - "Dockerfile.foxhunter"
      - "custom_nodes/foxhunter_compat/**"
      - "manifests/foxhunter_models.json"
      - "scripts/*foxhunter*"
      - "workflows/foxhunter_seed_hunter_v3.json"
      - "requirements/huggingface.txt"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: community-cu128
            pytorch_image: pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime@sha256:7b324d212a4450795b49edba9949b7cdc72429148a64e974334bfe5774d51385
            require_comfy_kitchen_cuda: "0"
          - variant: fast-cu130
            pytorch_image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-runtime@sha256:1f57418aedd9a4d0d3a59646619e1d4f82cacc33817247cead4f749e1f452d4b
            require_comfy_kitchen_cuda: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.foxhunter
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/minimax-h3-i2v:foxhunter-${{ matrix.variant }}
          build-args: |
            PYTORCH_IMAGE=${{ matrix.pytorch_image }}
            MINIMAX_H3_RUNTIME_VARIANT=${{ matrix.variant }}
            REQUIRE_COMFY_KITCHEN_CUDA_DEFAULT=${{ matrix.require_comfy_kitchen_cuda }}
          provenance: false
          cache-from: type=gha,scope=foxhunter-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=foxhunter-${{ matrix.variant }}
