name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight unit-test dependency
        run: python -m pip install "numpy==2.2.6"
      - name: Verify Hugging Face dependency compatibility and tokenizer import
        run: |
          python -m pip install -r requirements/huggingface.txt
          python -m pip check
          python -c "from transformers import CLIPTokenizer; from huggingface_hub import HfApi, hf_hub_download; import hf_xet"
      - name: Validate Python and pinned assets
        run: python -m unittest discover -s tests -v
      - name: Verify real aria2 checkpoint filename and resume without external services
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          python scripts/check_r2v_download_runtime.py
      - name: Validate extra LoRA URL list without model downloads
        run: python scripts/download_extra_loras.py --list manifests/extra_loras.txt --check
      - name: Verify every workflow node against pinned ComfyUI
        run: |
          git clone --depth 1 --branch v0.37.0 https://github.com/Comfy-Org/ComfyUI.git .ci-ComfyUI
          test "$(git -C .ci-ComfyUI rev-parse HEAD)" = "73c9bad4d21e7addbe1d13bc92eee0f1431b017d"
          git init .ci-FirstBlockCache
          git -C .ci-FirstBlockCache remote add origin https://github.com/duckyshell/ComfyUI-MiniMaxH3-FirstBlockCache.git
          git -C .ci-FirstBlockCache fetch --depth 1 origin 725973c3bfd9de6dce249bc93dc5fe27f820df31
          git -C .ci-FirstBlockCache checkout --detach FETCH_HEAD
          test "$(git -C .ci-FirstBlockCache rev-parse HEAD)" = "725973c3bfd9de6dce249bc93dc5fe27f820df31"
          git init .ci-MiniMaxH3-Director
          git -C .ci-MiniMaxH3-Director remote add origin https://github.com/AIMixer/ComfyUI_MiniMaxH3_Director.git
          git -C .ci-MiniMaxH3-Director fetch --depth 1 origin a267324a9f88141ff4e4b0e8c1a6ed90b4e45db7
          git -C .ci-MiniMaxH3-Director checkout --detach FETCH_HEAD
          test "$(git -C .ci-MiniMaxH3-Director rev-parse HEAD)" = "a267324a9f88141ff4e4b0e8c1a6ed90b4e45db7"
          git -C .ci-MiniMaxH3-Director apply --recount --check ../patches/minimax_h3_director_segments_no_concat.patch
          git -C .ci-MiniMaxH3-Director apply --recount ../patches/minimax_h3_director_segments_no_concat.patch
          python -c 'from pathlib import Path; p=Path(".ci-MiniMaxH3-Director/director/h3_motion_context.py"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n"))'
          git -C .ci-MiniMaxH3-Director apply --recount --check ../patches/minimax_h3_director_fl2v_motion_context.patch
          git -C .ci-MiniMaxH3-Director apply --recount ../patches/minimax_h3_director_fl2v_motion_context.patch
          grep -Fq "MiniMAXH- local fix for AIMixer issue #26" .ci-MiniMaxH3-Director/director/h3_motion_context.py
          mkdir .ci-story-workflows
          python scripts/build_story_workflows.py \
            --director-source .ci-MiniMaxH3-Director/example_workflows/minimax_h3_director_fl2v.json \
            --output-dir .ci-story-workflows
          cmp .ci-story-workflows/minimax_h3_story_quality_lora_2x.json workflows/minimax_h3_story_quality_lora_2x.json
          cmp .ci-story-workflows/minimax_h3_story_easycache_lora_2x.json workflows/minimax_h3_story_easycache_lora_2x.json
          cmp .ci-story-workflows/minimax_h3_story_quality_lora_2x_auto_mosaic.json workflows/minimax_h3_story_quality_lora_2x_auto_mosaic.json
          cmp .ci-story-workflows/minimax_h3_story_easycache_lora_2x_auto_mosaic.json workflows/minimax_h3_story_easycache_lora_2x_auto_mosaic.json
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_i2v.json \
            --manifest manifests/minimax_h3_i2v.json \
            --mode i2v \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_i2v_easycache.json \
            --manifest manifests/minimax_h3_i2v.json \
            --mode i2v \
            --expect-easycache \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_i2v_upscale.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode i2v \
            --expect-upscale \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_i2v_hmmotion_lora_upscale.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode i2v \
            --expect-upscale \
            --expect-lora \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_i2v_selectable_lora_upscale.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode i2v \
            --expect-upscale \
            --expect-lora HMNSFW_AIO_V2.safetensors \
            --expect-lora-strength 0.5 \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_story_quality_lora_2x.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode story \
            --expect-upscale \
            --expect-lora HMNSFW_AIO_V2.safetensors \
            --expect-lora-strength 0.5 \
            --comfyui-root .ci-ComfyUI \
            --custom-node-root .ci-MiniMaxH3-Director \
            --custom-node-root custom_nodes/minimax_h3_ordered_storyboard \
            --custom-node-root custom_nodes/minimax_h3_memory
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_story_easycache_lora_2x.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode story \
            --expect-easycache \
            --expect-upscale \
            --expect-lora HMNSFW_AIO_V2.safetensors \
            --expect-lora-strength 0.5 \
            --comfyui-root .ci-ComfyUI \
            --custom-node-root .ci-MiniMaxH3-Director \
            --custom-node-root custom_nodes/minimax_h3_ordered_storyboard \
            --custom-node-root custom_nodes/minimax_h3_memory
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_i2v_easycache_upscale.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode i2v \
            --expect-easycache \
            --expect-upscale \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_r2v.json \
            --manifest manifests/minimax_h3_r2v.json \
            --mode r2v \
            --require-video-reference \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_auto_mosaic_workflows.py \
            --comfyui-root .ci-ComfyUI \
            --director-root .ci-MiniMaxH3-Director \
            --local-node-root custom_nodes/minimax_h3_ordered_storyboard
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_r2v_easycache.json \
            --manifest manifests/minimax_h3_r2v.json \
            --mode r2v \
            --expect-easycache \
            --require-video-reference \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_r2v_upscale.json \
            --manifest manifests/minimax_h3_r2v_upscale.json \
            --mode r2v \
            --expect-upscale \
            --require-video-reference \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_r2v_easycache_upscale.json \
            --manifest manifests/minimax_h3_r2v_upscale.json \
            --mode r2v \
            --expect-easycache \
            --expect-upscale \
            --require-video-reference \
            --comfyui-root .ci-ComfyUI
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_preset_01_quality.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode i2v --expect-upscale --expect-auto-mosaic --expect-h3-memory \
            --auto-mosaic-manifest manifests/auto_mosaic.json \
            --expect-lora HMNSFW_AIO_V2.safetensors --expect-lora-strength 0.5 \
            --comfyui-root .ci-ComfyUI \
            --custom-node-root custom_nodes/minimax_h3_ordered_storyboard \
            --custom-node-root custom_nodes/minimax_h3_memory
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_preset_02_fast_fbcache.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode i2v --expect-upscale --expect-auto-mosaic --expect-first-block-cache --expect-h3-memory \
            --auto-mosaic-manifest manifests/auto_mosaic.json \
            --expect-lora HMNSFW_AIO_V2.safetensors --expect-lora-strength 0.5 \
            --comfyui-root .ci-ComfyUI \
            --custom-node-root custom_nodes/minimax_h3_ordered_storyboard \
            --custom-node-root custom_nodes/minimax_h3_memory \
            --custom-node-root .ci-FirstBlockCache
          python scripts/verify_workflow.py \
            --workflow workflows/minimax_h3_preset_03_turbo.json \
            --manifest manifests/minimax_h3_i2v_upscale.json \
            --mode i2v --expect-upscale --expect-auto-mosaic --expect-turbo --expect-h3-memory \
            --auto-mosaic-manifest manifests/auto_mosaic.json \
            --expect-lora HMNSFW_AIO_V2.safetensors --expect-lora-strength 0.0 \
            --comfyui-root .ci-ComfyUI \
            --custom-node-root custom_nodes/minimax_h3_ordered_storyboard \
            --custom-node-root custom_nodes/minimax_h3_memory
      - name: Validate shell scripts
        run: bash -n scripts/entrypoint.sh scripts/entrypoint_r2v.sh scripts/download_models.sh
      - name: Verify opt-in character R2V against pinned native nodes
        run: |
          python scripts/build_character_workflow.py --output-dir .ci-character
          cmp .ci-character/character_reveal_r2v_2x.json workflows/character_reveal_r2v_2x.json
          python scripts/verify_workflow.py \
            --workflow workflows/character_reveal_r2v_2x.json \
            --manifest manifests/minimax_h3_r2v_upscale.json \
            --mode r2v --expect-upscale --expect-auto-mosaic --expect-memory-safe-decode \
            --auto-mosaic-manifest manifests/auto_mosaic.json \
            --comfyui-root .ci-ComfyUI \
            --custom-node-root custom_nodes/minimax_h3_ordered_storyboard
      - name: Validate custom-node JavaScript
        run: |
          node --check custom_nodes/minimax_h3_ordered_storyboard/web/ordered_storyboard.js
          node --check custom_nodes/minimax_h3_ordered_storyboard/web/refmod_images.js
          node scripts/check_refmod_ui.mjs
          node --check custom_nodes/minimax_h3_ordered_storyboard/web/upscale_compare.js
          node scripts/check_compare_ui.mjs
      - name: Verify R2VA-only INT8 VAE workflow
        run: |
          python scripts/build_character_workflow.py --int8-vae --output-dir .ci-r2v-only
          cmp .ci-r2v-only/character_reveal_r2v_int8_2x.json workflows/character_reveal_r2v_int8_2x.json
          python scripts/verify_workflow.py \
            --workflow workflows/character_reveal_r2v_int8_2x.json \
            --manifest manifests/minimax_h3_r2v_int8_upscale.json \
            --mode r2v --expect-upscale --expect-auto-mosaic --expect-memory-safe-decode \
            --auto-mosaic-manifest manifests/auto_mosaic.json \
            --comfyui-root .ci-ComfyUI \
            --custom-node-root custom_nodes/minimax_h3_ordered_storyboard
      - name: Verify all selected R2VA model profiles
        # Profile workflows are generated at startup; all variants need node verification.
        run: python scripts/check_r2v_profiles.py --comfyui-root .ci-ComfyUI
      - name: Validate JSON files
        run: |
          for file in manifests/*.json workflows/*.json runpod-template*.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Real CPU RefMod tensors and upstream file compatibility
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.8.0 Pillow==11.3.0 packaging==25.0
          python -m pip check
          git clone https://github.com/Luisacaotica/ComfyUI-MiniMaxH3Mod.git .ci-refmod-source
          git -C .ci-refmod-source checkout --detach f9462081e28794389b5a6c5067eb327412ad8ee7
          python scripts/install_refmod_runtime.py --source .ci-refmod-source --destination .ci-refmod-vendor
          MINIMAX_H3_REFMOD_ROOT="$PWD/.ci-refmod-vendor" python -m unittest discover -s tests -p test_character_refmod.py -v
      - name: Real CPU X2 decoder packing and lifecycle
        run: |
          git clone https://github.com/TripleHeadedMonkey/ComfyUI-MiniMaxH3_LatentUpscaler.git .ci-x2-vae-source
          git -C .ci-x2-vae-source checkout --detach 2e568dfe3e4f5e81da178bc845e05dcfbb64d55b
          python scripts/install_x2_vae_runtime.py --source .ci-x2-vae-source --destination .ci-ComfyUI/custom_nodes/minimax_h3_x2_vae
          python scripts/check_x2_vae_runtime.py --comfyui-root .ci-ComfyUI --isolated
