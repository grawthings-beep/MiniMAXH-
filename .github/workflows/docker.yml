name: Build container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "custom_nodes/**"
      - "manifests/**"
      - "patches/**"
      - "scripts/**"
      - "workflows/**"
      - "runpod-template*.json"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: community-cu128
            pytorch_image: pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime@sha256:7b324d212a4450795b49edba9949b7cdc72429148a64e974334bfe5774d51385
            require_comfy_kitchen_cuda: "0"
            comfyui_args: "--lowvram --vram-headroom 2"
            publish_default: true
          - variant: fast-cu130
            pytorch_image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-runtime@sha256:1f57418aedd9a4d0d3a59646619e1d4f82cacc33817247cead4f749e1f452d4b
            require_comfy_kitchen_cuda: "1"
            comfyui_args: "--lowvram --vram-headroom 2"
            publish_default: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/minimax-h3-i2v
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.publish_default }}
            type=raw,value=${{ matrix.variant }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
            type=semver,pattern={{version}},enable=${{ matrix.publish_default }}
            type=sha,suffix=-${{ matrix.variant }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTORCH_IMAGE=${{ matrix.pytorch_image }}
            MINIMAX_H3_RUNTIME_VARIANT=${{ matrix.variant }}
            REQUIRE_COMFY_KITCHEN_CUDA_DEFAULT=${{ matrix.require_comfy_kitchen_cuda }}
            COMFYUI_ARGS_DEFAULT=${{ matrix.comfyui_args }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
